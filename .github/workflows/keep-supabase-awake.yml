name: Keep Supabase Awake

on:
  schedule:
    # Runs at 00:00 UTC every 3 days (e.g., Day 1, 4, 7...)
    - cron: '0 0 */3 * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          echo "Pinging Supabase to prevent sleep..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/projects?select=id&limit=1")
          
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Successfully pinged database! (Status: $HTTP_STATUS)"
          else
            echo "Failed to ping database. (Status: $HTTP_STATUS)"
            echo "Please check if your GitHub Secrets are configured correctly."
            exit 1
          fi
